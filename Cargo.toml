[package]
name = "smdctl"
version = "0.1.0"
edition = "2021"
description = "Docker-like systemd user/system service CLI (Linux)"
license = "MIT"
repository = "https://github.com/nexo-tech/smdctl"
rust-version = "1.74"

[[bin]]
name = "smdctl"
path = "src/main.rs"

[lib]
name = "smdctl"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
comfy-table = "7"
libc = "0.2"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
